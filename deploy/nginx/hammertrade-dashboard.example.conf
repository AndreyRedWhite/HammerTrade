# nginx reverse proxy + TLS for the HammerTrade dashboard.
# The Flask app listens on 127.0.0.1:8787 (app-level Basic Auth). nginx adds
# TLS and (optionally) a second auth layer.
#
# Prereqs:
#   - A DNS name pointing to this server (Let's Encrypt cannot issue for a bare IP).
#   - sudo apt install nginx certbot python3-certbot-nginx
#
# Setup:
#   1) Put this file at /etc/nginx/sites-available/hammertrade-dashboard.conf
#      and symlink into sites-enabled; set server_name to your domain.
#   2) sudo nginx -t && sudo systemctl reload nginx
#   3) sudo certbot --nginx -d dash.example.com   # provisions + wires TLS certs
#   4) certbot edits this file to add the ssl_certificate lines + :443 server.
#
# Until a domain exists, you can instead reach the dashboard with NO public
# exposure via an SSH tunnel:
#   ssh -L 8787:127.0.0.1:8787 vorontsov@158.160.204.201
#   then open http://localhost:8787 in your browser.

server {
    listen 80;
    server_name dash.example.com;   # <-- set to your domain

    # Optional second auth layer at the edge (htpasswd):
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd_hammertrade <user>
    # auth_basic "HammerTrade";
    # auth_basic_user_file /etc/nginx/.htpasswd_hammertrade;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
        access_log off;
    }
}
